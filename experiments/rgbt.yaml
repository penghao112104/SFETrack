DATA:
  MAX_SAMPLE_INTERVAL: 200
  MEAN:
  - 0.485
  - 0.456
  - 0.406
  SEARCH:
    CENTER_JITTER: 3
    FACTOR: 4.0
    SCALE_JITTER: 0.25
    SIZE: 256
    NUMBER: 1
  STD:
  - 0.229
  - 0.224
  - 0.225
  TEMPLATE:
    CENTER_JITTER: 0
    FACTOR: 2.0
    SCALE_JITTER: 0
    SIZE: 128
    NUMBER: 2
  TRAIN:
    DATASETS_NAME:
    - LasHeR_train
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 60000
  VAL:
    DATASETS_NAME:
    - LasHeR_val
    DATASETS_RATIO:
    - 1
    SAMPLE_PER_EPOCH: 10000

MODEL:
  PRETRAIN_FILE: pretrained/DropTrack_k700_800E_alldata.pth.tar
  EXTRA_MERGER: False
  RETURN_INTER: False
  MOE:
    INSERT_LAYER: 12
    ALPHA: 0.7
  BACKBONE:
    TYPE: vit_base_patch16_224_ce_adapter
    STRIDE: 16
    CE_LOC: [3, 6, 9]
    CE_KEEP_RATIO: [1, 1, 1]
    CE_TEMPLATE_RANGE: 'CTR_POINT'
  HEAD:
    TYPE: CENTER
    NUM_CHANNELS: 256

TRAIN:
  BACKBONE_MULTIPLIER: 0.1
  MOE_LR_MULTIPLIER: 1
  HEAD_LR_MULTIPLIER: 0.1
  DROP_PATH_RATE: 0.1
  CE_START_EPOCH: 4
  CE_WARM_EPOCH: 16
  BATCH_SIZE: 32
  EPOCH: 40
  GIOU_WEIGHT: 2.0
  L1_WEIGHT: 5.0
  GRAD_CLIP_NORM: 0.1
  LR: 0.0001
  LR_DROP_EPOCH: 20
  NUM_WORKER: 10
  OPTIMIZER: ADAMW
  PRINT_INTERVAL: 50
  SCHEDULER:
    TYPE: step
    DECAY_RATE: 0.1
  VAL_EPOCH_INTERVAL: 1
  WEIGHT_DECAY: 0.0001
  AMP: False
  MOE_SCHEDULE_MODE: staged
  MOE_STAGE_START_EPOCH: 31
  MOE_STAGE_ALL_MOE_END: 40
  MOE_STAGE_FREEZE_BOX_HEAD: False
  MOE_STAGE_HEAD_LR_MULTIPLIER: 0.1
  MOE_STAGE_FUSION_LR_MULTIPLIER: 1
  MOE_ROUTER_BALANCE_WEIGHT: 0.001
  MOE_AUX_PAST_GAP: 5
  MOE_AUX_FUTURE_GAP: 5
  MOE_AUX_FEATURE_WEIGHT: 0.001
  PROMPT:
    TYPE: bat
  FIX_BN: true
  SAVE_EPOCH_INTERVAL: 0
  SAVE_LAST_N_EPOCH: 5

TEST:
  EPOCH: 40
  SEARCH_FACTOR: 4.0
  SEARCH_SIZE: 256
  TEMPLATE_FACTOR: 2.0
  TEMPLATE_SIZE: 128
  UPDATE_INTERVAL: 10
  UPDATE_THRESHOLD: 0.65
  TARGET_PRESERVATION_THRESHOLD: 0.5
